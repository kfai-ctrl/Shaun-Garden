<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaun Garden Hidroponik 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-cream: #f6f3e4;
            --garden-green: #67a37b;
            --garden-green-dark: #4a7a5a;
            --white: #ffffff;
            --text-dark: #2d4a22;
            --accent-yellow: #fdbd33;
            --radius: 25px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 350px; 
        }

        /* ===== HEADER SECTION DENGAN GAMBAR BARU ===== */
        .header-container {
            margin-top: 50px;
            position: relative;
            text-align: center;
            margin-bottom: 40px;
            display: inline-block;
        }
        .logo-box {
            background-color: var(--garden-green);
            color: white;
            padding: 15px 70px;
            border-radius: 60px;
            border: 5px solid #417d56;
            font-size: 2.8rem;
            font-weight: 900;
            display: inline-block;
            box-shadow: 0 5px 0px #326143;
            position: relative;
            z-index: 2;
        }
        /* GAMBAR YANG KAMU MINTA */
        .shaun-img {
            position: absolute;
            right: -55px; /* Mengatur posisi ke kanan */
            top: -45px;   /* Mengatur posisi ke atas */
            width: 130px; /* Ukuran gambar */
            z-index: 5;   /* Agar muncul di atas logo */
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }

        /* ===== MAIN LAYOUT ===== */
        .wrapper {
            width: 95%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 20px;
            z-index: 10;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1.5px solid rgba(255,255,255,0.9);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
        }
