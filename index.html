<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaun Garden Hidroponik 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-cream: #f6f3e4;
            --garden-green: #67a37b;
            --garden-green-dark: #4a7a5a;
            --white: #ffffff;
            --text-dark: #2d4a22;
            --accent-yellow: #fdbd33;
            --radius: 25px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 280px; 
        }

        .header-container {
            margin-top: 40px;
            position: relative;
            text-align: center;
            margin-bottom: 40px;
        }
        .logo-box {
            background-color: var(--garden-green);
            color: white;
            padding: 12px 60px;
            border-radius: 60px;
            border: 5px solid #417d56;
            font-size: 2.8rem;
            font-weight: 900;
            display: inline-block;
            box-shadow: 0 4px 0px #326143;
        }
        .shaun-img {
            position: absolute;
            right: -55px;
            top: -20px;
            width: 100px;
            z-index: 5;
        }

        .wrapper {
            width: 95%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 20px;
            z-index: 10;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            border: 1.5px solid rgba(255,255,255,0.9);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
        }

        .section-label {
            font-weight: 800;
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Update grid ke 2 kolom karena ultrasonic 2 dihapus */
        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .sensor-item {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            position: relative;
            overflow: hidden;
            min-height: 200px;
            display: flex;
            flex-direction: column;
        }
        .sensor-item::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 80px; height: 80px;
            background: #e1eed4;
            border-radius: 0 0 0 100%;
            z-index: 1;
        }
        .sensor-header { font-size: 0.85rem; font-weight: 800; color: var(--garden-green-dark); margin-bottom: 15px; }
        .sensor-emoji { font-size: 2rem; margin: 10px 0; }
        .sensor-value { font-size: 2.2rem; font-weight: 900; margin-top: auto; margin-bottom: 15px; color: #4a7a5a; }
        .sensor-unit { font-size: 1rem; font-weight: 700; color: #777; margin-left: 4px; }
        .sensor-footer { font-size: 0.7rem; color: #888; border-top: 1px solid #f0f0f0; padding-top: 8px; line-height: 1.3; }

        .control-panel { display: flex; flex-direction: column; gap: 20px; }
        .status-box { text-align: center; }
        .bolt-icon {
            font-size: 4.2rem;
            color: var(--accent-yellow);
            margin: 15px 0;
        }
        .relay-title { font-weight: 900; font-size: 1.35rem; letter-spacing: 1px; }
        .relay-desc { font-size: 0.75rem; color: #888; margin-top: 8px; }

        .btn-group { display: flex; gap: 12px; margin-top: 15px; }
        .btn-action {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 15px;
            font-weight: 900;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-on { background-color: var(--garden-green); color: white; }
        .btn-off { background-color: #e2e2e2; color: #666; }
        .btn-action:active { transform: scale(0.96); }

        .config-toggle {
            position: fixed; top: 15px; left: 15px; z-index: 1000;
            background: #fff; border: 2px solid var(--garden-green);
            padding: 8px 12px; border-radius: 10px; cursor: pointer;
            font-size: 1.3rem;
        }
        #config-menu {
            display: none; position: fixed; top: 60px; left: 15px;
            background: white; padding: 20px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12); z-index: 1000; width: 290px;
        }
        #config-menu input {
            width: 100%; padding: 10px; margin: 8px 0; border: 2px solid #ddd; border-radius: 10px;
        }
        #config-menu label { font-weight: 700; color: var(--garden-green-dark); display: block; margin-top: 8px; }

        .badge-status { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 5px; }
        .badge { background: white; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; border: 1px solid #ddd; }
        .badge.online { color: green; border-color: green; }

        .farm-footer {
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            height: 260px;
            z-index: 1; 
            pointer-events: none;
            overflow: hidden;
        }
        .barn {
            position: absolute; 
            bottom: 85px; 
            left: 50%;
            transform: translateX(-50%); 
            width: 170px; 
            z-index: 5;
        }
        .road { 
            position: absolute; 
            bottom: 40px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 380px; 
            height: 90px; 
            background: #eed18b; 
            clip-path: polygon(20% 100%, 80% 100%, 58% 30%, 42% 30%); 
            z-index: 3;
        }
        .fence { 
            position: absolute; 
            bottom: 70px; 
            width: 100%; 
            height: 55px; 
            background-image: repeating-linear-gradient(90deg, #96613d, #96613d 14px, transparent 14px, transparent 28px); 
            border-top: 8px solid #7a4a2d; 
            z-index: 4;
        }
        .grass-layer { 
            position: absolute; 
            bottom: 0; 
            width: 100%; 
            height: 110px; 
            background: #86bc42; 
            z-index: 2; 
            border-radius: 50% 50% 0 0 / 40px 40px 0 0; 
        }

        @media (max-width: 900px) {
            .wrapper { grid-template-columns: 1fr; }
            .sensor-grid { grid-template-columns: 1fr; }
            body { padding-bottom: 320px; }
            .shaun-img { width: 85px; right: -35px; }
        }
    </style>
</head>
<body>

<div class="badge-status">
    <div class="badge" id="status-bt">BT Offline</div>
    <div class="badge" id="status-fb">DB Offline</div>
</div>

<button class="config-toggle" onclick="toggleSettings()">⚙️ Settings</button>

<div id="config-menu">
    <label>Firebase API Key</label>
    <input type="password" id="fb-apiKey">
    <label>Database URL</label>
    <input type="text" id="fb-dbUrl">
    <label>Node Path</label>
    <input type="text" id="fb-path" value="smarthome/ruangan1">
    <button class="btn-action btn-on" id="btn-connect-fb" style="width:100%; margin:10px 0 5px;">Connect Cloud</button>
    <hr>
    <button class="btn-action btn-on" id="btn-connect-ble" style="width:100%;">Connect Micro:bit</button>
    <button class="btn-action btn-off" id="btn-disconnect-ble" style="width:100%; display:none;">Disconnect BLE</button>
    <div id="terminalLog" style="font-size: 9px; height: 70px; overflow-y: auto; background: #f0f0f0; margin-top: 12px; padding: 6px; border-radius:8px; font-family: 'Space Mono';"></div>
</div>

<div class="header-container">
    <div class="logo-box">Shaun garden</div>
    <img src="https://raw.githubusercontent.com/kfai-ctrl/Shaun-Garden/refs/heads/main/Vector%2078.png" class="shaun-img" alt="Shaun">
</div>

<div class="wrapper">
    <div class="glass-card">
        <div class="section-label"><i class="fas fa-seedling" style="color: #4a7a5a;"></i> Live Sensor Data</div>
        <div class="sensor-grid">
            <div class="sensor-item">
                <div class="sensor-header"><i class="fas fa-tint" style="color: #3a86ff;"></i> Ultrasonik 1 - P0 / P1</div>
                <div class="sensor-emoji">💧</div>
                <div class="sensor-value" id="val-jarak">--<span class="sensor-unit">cm</span></div>
                <div class="sensor-footer">Pompa Relay ON jika jarak ≥ 30 cm</div>
            </div>
            
            <div class="sensor-item">
                <div class="sensor-header"><i class="fas fa-thermometer-half" style="color: #e63946;"></i> DHT22 - SUHU / HUMIDITY</div>
                <div class="sensor-emoji">🌡️</div>
                <div class="sensor-value" style="font-size: 1.6rem;">
                    <span id="val-temp">--</span>°C <span id="val-hum">--</span>%
                </div>
                <div class="sensor-footer">Monitoring suhu dan kelembapan</div>
            </div>
        </div>
    </div>

    <div class="control-panel">
        <div class="glass-card status-box">
            <div class="section-label" style="justify-content: center;"><i class="fas fa-bolt"></i> STATUS POMPA</div>
            <div class="bolt-icon"><i class="fas fa-bolt"></i></div>
            <div class="relay-title" id="lbl-relay">RELAY OFF</div>
            <div class="relay-desc">Pin P13 - Kontrol pompa secara otomatis/manual</div>
        </div>

        <div class="glass-card status-box">
            <div class="section-label" style="justify-content: center;"><i class="fas fa-tools"></i> MANUAL CONTROL</div>
            <p style="font-size: 0.85rem; font-weight: 700; margin-bottom: 12px;">Kontrol pompa secara manual</p>
            <div class="btn-group">
                <button class="btn-action btn-on" onclick="manualRelay(1)">ON</button>
                <button class="btn-action btn-off" onclick="manualRelay(0)">OFF</button>
            </div>
        </div>
    </div>
</div>

<div class="farm-footer">
    <div class="barn">
        <svg viewBox="0 0 200 200" xmlns="
