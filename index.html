<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaun Garden Hidroponik 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root {
            --bg-cream: #f6f3e4;
            --garden-green: #67a37b;
            --garden-green-dark: #4a7a5a;
            --white: #ffffff;
            --text-dark: #2d4a22;
            --accent-yellow: #fdbd33;
            --radius: 25px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 300px; 
        }

        /* ===== HEADER DENGAN GAMBAR SHAUN ===== */
        .header-container {
            margin-top: 60px;
            position: relative;
            text-align: center;
            margin-bottom: 40px;
        }
        .logo-box {
            background-color: var(--garden-green);
            color: white;
            padding: 12px 60px;
            border-radius: 60px;
            border: 5px solid #417d56;
            font-size: 2.5rem;
            font-weight: 900;
            display: inline-block;
            box-shadow: 0 5px 0px #326143;
            position: relative;
            z-index: 2;
        }
        /* Gambar Shaun di Kanan Atas Logo */
        .shaun-img {
            position: absolute;
            right: -45px;
            top: -55px;
            width: 120px;
            z-index: 10;
            pointer-events: none;
        }

        /* ===== LAYOUT UTAMA ===== */
        .wrapper {
            width: 95%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            z-index: 15;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }

        .section-label { font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }

        /* SENSOR CARDS */
        .sensor-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .sensor-item {
            background: var(--white);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid #eee;
            position: relative;
            overflow: hidden;
            min-height: 180px;
        }
        .sensor-item::after {
            content: ''; position: absolute; top: 0; right: 0;
            width: 60px; height: 60px; background: #e1eed4;
            border-radius: 0 0 0 100%;
        }
        .sensor-header { font-size: 0.75rem; font-weight: 800; color: var(--garden-green-dark); margin-bottom: 10px; }
        .sensor-value { font-size: 2rem; font-weight: 900; color: var(--garden-green-dark); margin-top: 20px; }
        .sensor-unit { font-size: 0.9rem; color: #888; }

        /* CONTROLS */
        .control-panel { display: flex; flex-direction: column; gap: 20px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-action { flex: 1; padding: 12px; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; }
        .btn-on { background: var(--garden-green); color: white; }
        .btn-off { background: #ddd; color: #666; }
