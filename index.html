<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaun Garden Hidroponik 🌱</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-cream: #f6f3e4;
            --garden-green: #67a37b;
            --garden-green-dark: #4a7a5a;
            --soft-green: #e9f5db;
            --white: #ffffff;
            --text-dark: #2d4a22;
            --accent-yellow: #fdbd33;
            --radius: 25px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 350px; /* Space for barn illustration */
        }

        /* ===== HEADER SECTION ===== */
        .header-container {
            margin-top: 40px;
            position: relative;
            text-align: center;
            margin-bottom: 40px;
        }
        .logo-box {
            background-color: var(--garden-green);
            color: white;
            padding: 12px 60px;
            border-radius: 60px;
            border: 5px solid #417d56;
            font-size: 2.8rem;
            font-weight: 900;
            display: inline-block;
            box-shadow: 0 4px 0px #326143;
            position: relative;
            z-index: 2;
        }

        /* ===== ANIMASI GAMBAR SHAUN BARU ===== */
        .shaun-img-animated {
            position: absolute;
            right: -80px; /* Posisi di sebelah kanan logo */
            top: -60px;   /* Posisi di atas logo */
            width: 140px; /* Ukuran gambar */
            z-index: 5;
            pointer-events: none;
            /* Memanggil animasi */
            animation: floating 3s ease-in-out infinite;
        }

        /* Keyframes untuk animasi naik turun */
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); } /* Naik 20 pixel */
            100% { transform: translateY(0px); }
        }

        /* ===== MAIN LAYOUT ===== */
        .wrapper {
            width: 95%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 20px;
            z-index: 10;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1.5px solid rgba(255,255,255,0.9);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
        }

        .section-label {
            font-weight: 800;
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ===== SENSOR CARDS ===== */
        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .sensor-item {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            position: relative;
            overflow: hidden;
            min-height: 200px;
            display: flex;
            flex-direction: column;
        }
        .sensor-item::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 80px; height: 80px;
            background: #e1eed4;
            border-radius: 0 0 0 100%;
            z-index: 1;
        }
        .sensor-header {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--garden-green-dark);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
            z-index: 2;
        }
        .sensor-emoji { font-size: 2rem; margin: 10px 0; }
        .sensor-value {
            font-size: 2.2rem;
            font-weight: 900;
            margin-top: auto;
            margin-bottom: 15px;
            color: #4a7a5a;
        }
        .sensor-unit { font-size: 1rem; font-weight: 700; color: #777; margin-left: 4px; }
        .sensor-footer {
            font-size: 0.7rem;
            color: #888;
            border-top: 1px solid #f0f0f0;
            padding-top: 8px;
            line-height: 1.3;
        }

        /* ===== RIGHT PANEL CONTROLS ===== */
        .control-panel { display: flex; flex-direction: column; gap: 20px; }
        .status-box { text-align: center; }
        .bolt-icon {
            font-size: 4.5rem;
            color: var(--accent-yellow);
            margin: 20px 0;
            filter: drop-shadow(0 0 8px rgba(253, 189, 51, 0.4));
        }
        .relay-title { font-weight: 900; font-size: 1.4rem; letter-spacing: 1px; }
        .relay-desc { font-size: 0.75rem; color: #888; margin-top: 10px; }

        .btn-group { display: flex; gap: 12px; margin-top: 25px; }
        .btn-action {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 15px;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-on { background-color: var(--garden-green); color: white; }
        .btn-off { background-color: #e2e2e2; color: #666; }
        .btn-action:active { transform: scale(0.95); }

        /* ===== SYSTEM CONFIG (HIDDEN) ===== */
        .config-toggle {
            position: fixed; top: 15px; left: 15px; z-index: 1000;
            background: #fff; border: 2px solid var(--garden-green);
            padding: 8px; border-radius: 10px; cursor: pointer;
        }
        #config-menu {
            display: none; position: fixed; top: 60px; left: 15px;
            background: white; padding: 20px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 1000; width: 280px;
        }
        input { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }

        /* ===== FARM DECORATION ===== */
        .farm-footer {
            position: fixed; bottom: 0; width: 100%; height: 320px;
            z-index: 1; pointer-events: none;
        }
        .barn {
            position: absolute; bottom: 75px; left: 50%;
            transform: translateX(-50%); width: 200px; z-index: 4;
        }
        .grass-layer { position: absolute; bottom: 0; width: 100%; height: 140px; background: #86bc42; z-index: 2; border-radius: 50% 50% 0 0 / 30px 30px 0 0; }
        .fence { position: absolute; bottom: 50px; width: 100%; height: 70px; background-image: repeating-linear-gradient(90deg, #96613d, #96613d 12px, transparent 12px, transparent 25px); border-top: 10px solid #7a4a2d; z-index: 3; }
